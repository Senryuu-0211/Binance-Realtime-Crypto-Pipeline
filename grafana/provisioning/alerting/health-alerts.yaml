# =============================================================================
# Grafana ALERT RULES as code (unified alerting), reading crypto.health_checks.
#
# Kept IN-STACK on purpose: no Slack/email/PagerDuty wiring — the rules fire and
# show their state in Grafana's Alerting UI (and as state on the health panels).
# Production would attach a contact point (PagerDuty/Slack) to route these; that
# is a notification-policy change, NOT a query change.
#
# Each rule is the standard 3-node alert:
#   A = SQL query returning a single number (is the LATEST status bad? how many?)
#   B = reduce A to its last value
#   C = threshold: fire when that value > 0
# We alert on the LATEST recorded status (not a count over a window) so the alert
# CLEARS promptly once the pipeline recovers and the next check writes OK.
# =============================================================================
apiVersion: 1

groups:
  - orgId: 1
    name: pipeline-health
    folder: Pipeline Health
    interval: 1m                      # Grafana evaluates these rules every minute
    rules:
      # --- Overall freshness: is the WHOLE pipeline stalled? -----------------
      - uid: health-freshness-stale
        title: Pipeline data is STALE (end-to-end freshness)
        condition: C
        for: 0m                       # fire as soon as the latest check is STALE
        noDataState: OK               # no health rows yet => not an alert
        execErrState: OK              # transient query error => don't false-fire
        labels:
          severity: critical
        annotations:
          summary: "No fresh trades — the pipeline has likely stalled. Check producer, consumer, and Kafka."
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: clickhouse
            model:
              refId: A
              editorType: sql
              queryType: table
              datasource: { type: grafana-clickhouse-datasource, uid: clickhouse }
              rawSql: "SELECT toFloat64(argMax(status, checked_at) = 'STALE') AS v FROM crypto.health_checks WHERE check_name = 'freshness' AND checked_at > now() - INTERVAL 1 HOUR"
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              datasource: { type: __expr__, uid: __expr__ }
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }

      # --- Dead-man switch: WHO WATCHES THE HEALTHCHECK? ---------------------
      # The three rules above all say noDataState:OK, so if the healthcheck
      # SERVICE itself dies, no new rows are written -> those rules see "no data"
      # -> they go quietly OK and blind us. A process can't reliably fire an alert
      # about its OWN death (a crash/OOM/SIGKILL gives it no chance), so the only
      # robust pattern is a HEARTBEAT + absence detector: the healthcheck already
      # writes a 'freshness' row EVERY cycle (that's its heartbeat), and here we
      # alert when that heartbeat goes STALE (its newest row is too old).
      #
      # Why this one CAN fire (unlike the others) after the service dies: after
      # death the freshness rows REMAIN with an old checked_at, so max(checked_at)
      # is a real, ageing value — the query returns data, not no-data. We look
      # back 24h so even a long-dead healthcheck's last row is still in range.
      # noDataState:OK only suppresses the genuine cold start (no rows ever yet).
      # Threshold 660s = > 2 healthcheck cycles at the default 5-min interval;
      # raise it if you increase HEALTH_CHECK_INTERVAL_SECONDS.
      #
      # NOTE the residual SPOF: this detector lives INSIDE the stack, so it can't
      # alert if Grafana+ClickHouse ALSO die. Catching a whole-host outage needs a
      # heartbeat pushed to an EXTERNAL dead-man service (Healthchecks.io, Dead
      # Man's Snitch, PagerDuty heartbeat) — an upgrade, not a replacement.
      - uid: health-monitor-heartbeat
        title: Healthcheck monitor is DOWN (stale heartbeat)
        condition: C
        for: 0m
        noDataState: OK               # no rows EVER yet => cold start, not a failure
        execErrState: OK
        labels:
          severity: critical
        annotations:
          summary: >-
            No fresh rows from the healthcheck service — it has likely crashed or
            stalled. While it is down the STALE/STALLED/GAP alerts are BLIND, so
            treat this as a monitoring outage and restart the healthcheck.
        data:
          - refId: A
            relativeTimeRange: { from: 86400, to: 0 }
            datasourceUid: clickhouse
            model:
              refId: A
              editorType: sql
              queryType: table
              datasource: { type: grafana-clickhouse-datasource, uid: clickhouse }
              # Age (seconds) of the newest heartbeat. HAVING drops the empty-table
              # case to genuine no-data so cold start doesn't false-fire.
              rawSql: "SELECT toFloat64(dateDiff('second', max(checked_at), now())) AS v FROM crypto.health_checks WHERE check_name = 'freshness' HAVING max(checked_at) IS NOT NULL"
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              datasource: { type: __expr__, uid: __expr__ }
              expression: B
              conditions:
                - evaluator: { type: gt, params: [660] }

      # --- Per-symbol stall: is ANY single symbol's stream dead? -------------
      - uid: health-symbol-stalled
        title: A symbol stream is STALLED
        condition: C
        for: 0m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: "One or more symbols had no trades within the stall threshold while others kept flowing (partial failure)."
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: clickhouse
            model:
              refId: A
              editorType: sql
              queryType: table
              datasource: { type: grafana-clickhouse-datasource, uid: clickhouse }
              rawSql: "SELECT toFloat64(countIf(s = 'STALLED')) AS v FROM (SELECT symbol, argMax(status, checked_at) AS s FROM crypto.health_checks WHERE check_name = 'symbol_stall' AND checked_at > now() - INTERVAL 1 HOUR GROUP BY symbol)"
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              datasource: { type: __expr__, uid: __expr__ }
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }

      # --- Trade-ID gap: did the stream LOSE events during a reconnect? ------
      - uid: health-trade-gap
        title: Trade-ID gaps detected (missing events)
        condition: C
        for: 0m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: >-
            One or more symbols have gaps in their trade_id sequence — events
            were lost during a WebSocket disconnect. Check the value column for
            the count of missing trades per symbol.
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: clickhouse
            model:
              refId: A
              editorType: sql
              queryType: table
              datasource: { type: grafana-clickhouse-datasource, uid: clickhouse }
              rawSql: "SELECT toFloat64(countIf(s = 'GAP_DETECTED')) AS v FROM (SELECT symbol, argMax(status, checked_at) AS s FROM crypto.health_checks WHERE check_name = 'trade_gap' AND checked_at > now() - INTERVAL 1 HOUR GROUP BY symbol)"
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              datasource: { type: __expr__, uid: __expr__ }
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }
